# Render Blueprint — UNVEIL Media Verification Platform Backend
services:
  - type: web
    name: unveil-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/health